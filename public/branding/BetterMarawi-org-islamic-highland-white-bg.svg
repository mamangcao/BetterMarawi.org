                    <!-- Typography -->
                    <g id="typography-group">
                        <text id="svg-text-better" x="535" y="726" text-anchor="middle" fill="#1B4D3E" font-size="136" letter-spacing="-3" class="svg-logo-text" data-fill-role="text">Better</text>
                        <text id="svg-text-city" x="535" y="852" text-anchor="middle" fill="#1B4D3E" font-size="136" letter-spacing="-3" class="svg-logo-text" data-fill-role="text">Marawi</text>
                        <text id="svg-text-org" x="792" y="908" text-anchor="end" fill="#1B4D3E" font-size="56" letter-spacing="-1" class="svg-logo-text" data-fill-role="text">.org</text>
                    </g>
                </svg>