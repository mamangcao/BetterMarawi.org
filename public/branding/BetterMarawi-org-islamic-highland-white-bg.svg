<?xml version="1.0" standalone="no"?>
<svg id="better-marawi-svg" viewBox="0 0 1080 1080" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" class="w-full h-full block select-none">
                    <defs>
                        <style>
                            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;display=swap');
                            .svg-logo-text { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
                        </style>

                        <clipPath id="clip-sunburst-highland">
