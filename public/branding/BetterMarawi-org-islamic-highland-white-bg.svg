                            <path d="M 0 -46 C -15 -46 -26 -35 -26 -21 C -26 -7 -15 4 0 4 C 15 4 26 -7 26 -21 C 26 -16 23 -12 19 -9 C 14 -1 6 1 0 1 C -11 1 -19 -7 -19 -18 C -19 -28 -11 -37 0 -37 C 7 -37 14 -33 18 -27 C 14 -38 8 -46 0 -46 Z" transform="rotate(-35 0 -22)"/>
