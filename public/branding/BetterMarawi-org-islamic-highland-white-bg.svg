                                    <polygon points="0,0 -122,-250 -92,-264"/>
                                    <polygon points="0,0 -68,-272 -36,-280"/>
                                    <polygon points="0,0 -14,-284 14,-284"/>
                                    <polygon points="0,0 36,-280 68,-272"/>
                                    <polygon points="0,0 92,-264 122,-250"/>
                                    <polygon points="0,0 144,-238 172,-220"/>
                                    <polygon points="0,0 190,-206 214,-184"/>
                                    <polygon points="0,0 228,-166 248,-142"/>
                                    <polygon points="0,0 258,-122 272,-98"/>
                                    <polygon points="0,0 278,-78 286,-52"/>
