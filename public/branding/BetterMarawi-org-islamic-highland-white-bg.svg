                            <rect x="424" y="422" width="232" height="78" rx="8" fill="#1B4D3E" stroke="#F9FEFF" stroke-width="10" data-fill-role="shapes" data-stroke-role="bg"/>
                            <path d="M 452 500 V 458 C 452 444 468 436 468 436 C 468 436 484 444 484 458 V 500 Z" fill="#F9FEFF" data-fill-role="bg"/>
